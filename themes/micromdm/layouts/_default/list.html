<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"{{with .Site.LanguageCode}} xml:lang="{{.}}" lang="{{.}}"{{end}}>
  {{ partial "head.html" . }}
  <body>
    <main>
      {{ partial "navigation.html" . }}
      <div class="blog-post-list">
        {{ range .Data.Pages.ByLastmod.Reverse }}
        <article class="blog-post-list-box">
            <h2 class="blog-post-list-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
            <time class="post-date" datetime="{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Lastmod.Format "Mon, Jan 2, 2006" }}</time>
        </article>
        {{ end}}
        <div class="divided blog-post-list-contribute">
            <a href="https://github.com/micromdm/website/tree/main/content/blog">Contribute An Article</a>
        </div>
      </div>
    </main>
    {{ partial "footer.html" . }}
  </body>
</html>
